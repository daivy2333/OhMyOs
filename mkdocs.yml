site_name: 学习周记
site_description: 周度学习记录与心得
site_author: daivy
site_url: https://daivy2333.github.io/OhMyOs/

repo_name: daivy2333/OhMyOs
repo_url: https://github.com/daivy2333/OhMyOs
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 daivy

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

nav:
  - 首页: index.md
  - 周报索引:
      # NAV_WEEKS_START
      - W01 - 训练营后第一周: weeks/weekly-2026-W01.md
      # NAV_WEEKS_END

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false
